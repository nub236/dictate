[package]
name = "dictate"
version = "0.2.0"
description = "ChatGPT dictation, anywhere you type"
authors = ["dictate"]
license = "MIT"
edition = "2021"
# `Option::is_none_or` in keywords.rs needs 1.82, so the declared minimum has to
# match or cargo refuses a toolchain it could actually build with.
rust-version = "1.82"
# The package has a second binary (the probe) behind a feature, and `tauri dev`
# runs `cargo run` with no `--bin`, which cannot choose between them.
default-run = "dictate"

[features]
# The probe is a debugging aid that asks one question of the signed-in account:
# can this plan use the enhancement route, and with which models. It is opt-in
# so an ordinary build never compiles it.
probe = []

[[bin]]
name = "probe"
path = "src/bin/probe.rs"
required-features = ["probe"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api gives the toast window a fully transparent background so it
# can have rounded corners. It is required whenever a window is transparent.
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# PKCE verifiers and OAuth state need the OS entropy source. Reading
# /dev/urandom by path silently returned all zeros for a native Windows
# process, which left both values predictable there.
getrandom = "0.3"
hound = "3.5"
handy-keys = "0.3"
handy-recorder = "0.1"
once_cell = "1"
rphonetic = "4.0.0"
strsim = "0.11"
arboard = "3.7.0"
enigo = "0.6"
open = "5.4.4"
# Registers Dictate as a login item (LaunchAgent on macOS, a Run key on
# Windows) so the hotkey is live after a restart instead of the app having to
# be opened by hand.
tauri-plugin-autostart = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# Converts the toast window into an NSPanel. A plain NSWindow cannot be drawn
# over another app's full-screen Space, whatever its window level or collection
# behaviour says; the class has to be NSPanel. Same crate Handy's overlay uses.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat", "block2", "std"] }
# Reading which app is in front, so a dictation can pick the mode that fits it.
# No permission is needed for this, and only the app's identity is read.
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }
block2 = { version = "0.6", features = ["alloc"] }
objc2 = "0.6"
# Same accessibility prompt Handy uses; registers the app in the Accessibility
# list instead of quietly asking for a different TCC service.
macos-accessibility-client = "0.0.1"

[target.'cfg(target_os = "windows")'.dependencies]
# Which program has focus, and the title of its window, so a page in a browser
# can be recognised as a site rather than just "Firefox".
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
